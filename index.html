<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSPP GPRP — Suivi recrutement & formation</title>
<style>
  :root{
    --rouge:#b3121f; --rouge-f:#8c0d17; --bleu:#14213d; --bleu-2:#1f2f52;
    --fond:#f3f4f7; --carte:#fff; --texte:#1a1d24; --gris:#6b7280; --bord:#e2e5eb;
    --vert:#1f7a3f; --orange:#b45309;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--texte);font-size:15px}
  button,input,select,textarea{font:inherit;color:inherit}
  .btn{border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;background:var(--rouge);color:#fff}
  .btn:hover{background:var(--rouge-f)}
  .btn.sec{background:#fff;color:var(--texte);border:1px solid var(--bord)}
  .btn.sec:hover{background:#f7f7f9}
  .btn.danger{background:#fff;color:var(--rouge-f);border:1px solid #f5c2c7}
  .btn.petit{padding:5px 10px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:default}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bord);border-radius:8px;background:#fff}
  input:disabled,select:disabled,textarea:disabled{background:#f5f6f8;color:#4b5563}
  textarea{min-height:70px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid #f1b5ba;border-color:var(--rouge)}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--rouge);margin:0;flex:none}
  label.l{display:block;font-size:12.5px;font-weight:600;margin:10px 0 4px;color:#374151}
  .erreur{background:#fdecee;color:var(--rouge-f);border:1px solid #f5c2c7;padding:9px 12px;border-radius:8px;margin-top:12px;font-size:14px}
  .ok{background:#e8f5ec;color:var(--vert);border:1px solid #b7e0c3;padding:12px;border-radius:8px;font-size:14px}
  .sous{color:var(--gris);font-size:12.5px}
  .esp{flex:1}

  /* Connexion */
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--bleu),var(--bleu-2))}
  .login{background:#fff;border-radius:14px;padding:32px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .blason{width:56px;height:56px;border-radius:50%;background:var(--rouge);color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:14px}
  .login h1{margin:0;font-size:22px}
  .login p.st{margin:4px 0 18px;color:var(--gris);font-size:14px}
  .login .btn{width:100%;margin-top:18px;padding:11px}
  .indice{margin-top:16px;font-size:12.5px;color:var(--gris);background:#f7f7f9;border-radius:8px;padding:10px}

  /* Structure */
  .demo{background:#fff4d6;color:#7a5200;text-align:center;padding:7px;font-size:13px;border-bottom:1px solid #f0dc9c}
  header.top{background:var(--bleu);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 24px;flex-wrap:wrap}
  header.top .titre{font-weight:700;font-size:17px}
  header.top .titre small{display:block;font-weight:400;opacity:.7;font-size:12px}
  header.top .moi{text-align:right;font-size:13px;line-height:1.3}
  header.top .btn{background:transparent;border:1px solid rgba(255,255,255,.4)}
  nav.onglets{display:flex;gap:4px}
  nav.onglets button{background:transparent;border:0;color:#cfd6e6;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600}
  nav.onglets button.on{background:rgba(255,255,255,.12);color:#fff}
  main{max-width:1150px;margin:0 auto;padding:22px}
  h2{margin:0;font-size:20px}
  .barre{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .barre input{max-width:300px}
  .barre select{max-width:220px}

  .etapes{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0 18px}
  .etape{background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
  .etape:hover{border-color:#c9ced8}
  .etape.on{outline:2px solid var(--rouge);border-color:var(--rouge)}
  .etape .n{font-size:26px;font-weight:800}
  .etape .l{font-size:12.5px;color:var(--gris)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0 18px}
  .stat{background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:14px}
  .stat .n{font-size:26px;font-weight:800}
  .stat .l{color:var(--gris);font-size:13px}

  .carte{background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:18px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--gris);padding:9px 10px;border-bottom:1px solid var(--bord)}
  td{padding:10px;border-bottom:1px solid #f0f1f4;vertical-align:middle}
  tr.cliquable{cursor:pointer}
  tr.cliquable:hover td{background:#fafbfc}
  tr.inactif td{opacity:.5}
  .tbl-wrap{overflow-x:auto}
  .vide{text-align:center;color:var(--gris);padding:34px}

  .badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
  .r-responsable{background:#fde8ea;color:var(--rouge-f)}
  .r-recruteur{background:#e7eefc;color:#1e40af}
  .r-formateur{background:#efe7fb;color:#5b21b6}
  .r-recrue{background:#e8f5ec;color:var(--vert)}
  .r-recruteur_formateur{background:#e9e7fb;color:#3730a3}
  .r-commandement{background:#14213d;color:#fff}
  .e-candidature{background:#eef0f3;color:#374151}
  .e-convoque{background:#e7eefc;color:#1e40af}
  .e-fi{background:#fdf0dc;color:#92400e}
  .e-parrainage{background:#efe7fb;color:#5b21b6}
  .e-affecte{background:#e8f5ec;color:var(--vert)}
  .e-sortie{background:#fde8ea;color:var(--rouge-f)}
  .s-actif{color:var(--vert);font-weight:600;font-size:13px}
  .s-inactif{color:var(--gris);font-weight:600;font-size:13px}

  .prog{display:flex;align-items:center;gap:8px;min-width:130px}
  .prog .b{flex:1;height:7px;background:#eceef2;border-radius:99px;overflow:hidden}
  .prog .b i{display:block;height:100%;background:var(--rouge);border-radius:99px}
  .prog span{font-size:12px;color:var(--gris);width:38px;text-align:right}

  /* Fiche */
  .entete-fiche{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .entete-fiche h2{font-size:22px}
  .sections{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .sections .plein{grid-column:1/-1}
  .sec h3{margin:0 0 2px;font-size:16px;display:flex;align-items:center;gap:8px}
  .sec h3 .num{background:var(--bleu);color:#fff;border-radius:6px;font-size:12px;padding:2px 7px}
  .sec h3 .verrou{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--gris);background:#f0f1f4;border-radius:99px;padding:2px 8px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 12px}
  .coches{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:10px}
  .coche{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
  .resultat{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;background:#f3f4f7;color:var(--gris)}
  .resultat.ok{background:#e8f5ec;color:var(--vert)}
  .resultat.ko{background:#fde8ea;color:var(--rouge-f)}
  .module{display:grid;grid-template-columns:24px 1fr 150px 170px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f0f1f4}
  .module:last-child{border-bottom:0}
  .module .nom{font-size:14px}
  .module.fait .nom{color:var(--vert);font-weight:600}
  .ligne-item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f0f1f4;font-size:14px}
  .ligne-item:last-child{border-bottom:0}
  .ligne-item .d{color:var(--gris);font-size:12.5px;white-space:nowrap}
  .ajout{display:flex;gap:8px;margin-top:10px}
  .lien{background:none;border:0;color:var(--gris);cursor:pointer;font-size:13px;padding:2px 4px}
  .lien:hover{color:var(--rouge-f)}
  .barre-sauver{position:sticky;bottom:0;background:rgba(243,244,247,.95);backdrop-filter:blur(4px);padding:12px 0;margin-top:16px;display:flex;gap:10px;align-items:center;border-top:1px solid var(--bord)}
  .etat{font-size:13px;color:var(--gris)}
  .etat.modif{color:var(--orange);font-weight:600}
  .etat.err{color:var(--rouge-f);font-weight:600}

  /* Vue recrue */
  .liste-statut{list-style:none;margin:10px 0 0;padding:0}
  .liste-statut li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #f0f1f4;font-size:14px}
  .liste-statut li:last-child{border-bottom:0}
  .pastille{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;background:#eceef2;color:var(--gris)}
  .pastille.oui{background:var(--vert);color:#fff}
  .fiche dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;margin:10px 0 0}
  .fiche dt{color:var(--gris)}
  .fiche dd{margin:0;font-weight:600}

  /* Fenêtre */
  .voile{position:fixed;inset:0;background:rgba(15,20,35,.55);display:grid;place-items:center;padding:16px;z-index:10}
  .fenetre{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:24px}
  .fenetre h3{margin:0 0 4px}
  .ligne-mdp{display:flex;gap:8px}
  .ligne-mdp input{flex:1}
  .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
  .identifiants{font-family:ui-monospace,Consolas,monospace;background:#f7f7f9;border:1px dashed var(--bord);padding:12px;border-radius:8px;margin:12px 0;white-space:pre-wrap}

  @media (max-width:760px){
    .sections,.g2,.g3,.g4,.coches{grid-template-columns:1fr}
    .module{grid-template-columns:24px 1fr}
    .module input:not([type=checkbox]){grid-column:2}
    main{padding:14px}
    header.top{padding:10px 14px}
    .fiche dl{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
/* =====================================================================
   CONFIGURATION
   - Laisse FIREBASE_CONFIG à null pour tester en MODE DÉMO
     (données stockées seulement dans ton navigateur).
   - Pour la vraie version, colle ici l'objet firebaseConfig donné par Firebase.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB6cPVMd5BwC7puIUsXySWbFb7aIjvfm0g",
  authDomain: "bspp-gprp.firebaseapp.com",
  projectId: "bspp-gprp",
  storageBucket: "bspp-gprp.firebasestorage.app",
  messagingSenderId: "719518870559",
  appId: "1:719518870559:web:22229188118a42098fb92a",
};

// Les identifiants deviennent des adresses techniques (aucun mail n'est envoyé).
const DOMAINE_IDENTIFIANT = "bspp-gprp.fr";

/* ---------- Référentiel ---------- */
const ROLES = { commandement:"Commandement 12e Cie", responsable:"Responsable recrutement", recruteur_formateur:"Recruteur-formateur", recruteur:"Recruteur", formateur:"Formateur", recrue:"Recrue / Sapeur" };
const AFFECTATION_DEFAUT = "CS Ménilmontant";
const ETAPES = [["candidature","Candidature"],["convoque","Convoqué recrutement"],["fi","Formation initiale"],["parrainage","Parrainage"],["affecte","Affecté"],["sortie","Sortie du parcours"]];
const NOM_ETAPE = Object.fromEntries(ETAPES);
const DOCS = [["cni","CNI RP"],["casier","Casier judiciaire"],["medical","Certificat médical"],["lettre","Lettre de motivation"],["cv","CV RP"],["permis","Permis RP (facultatif)"],["psc1","PSC1 (bonus)"]];
const DOCS_OBLIG = ["cni","casier","medical","lettre","cv"];
const MODULES = [["m1","M1 — Accueil et vie militaire"],["m2","M2 — Radio et fonctionnement opérationnel"],["m3","M3 — Secours à personne (SUAP)"],["m4","M4 — Incendie"],["m5","M5 — Secours routier et opérations diverses"],["m6","M6 — Cas complets et cohésion"]];
const FISP = [["vl","Permis VL"],["sav","SAV"],["inc","INC"],["pl","Permis PL"]];
const GRADES = ["Élève sapeur","Sapeur 2CL","Sapeur 1CL","Caporal","Caporal-chef","Sergent","Sergent-chef","Adjudant","Adjudant-chef","Major","Lieutenant","Capitaine","Commandant","Lieutenant-colonel","Colonel"];

/* ---------- Droits (les mêmes sont imposés par firestore.rules) ---------- */
const CLES_MODIFIABLES = {
  recruteur: ["prenom","nom","discord","tel","matricule","cs","grade","etape","motifSortie","dateCandidature","docs","dossier","recrutement"],
  formateur: ["grade","etape","motifSortie","cs","fi","affectation","fisp","qualifs"],
  recruteur_formateur: ["prenom","nom","discord","tel","matricule","cs","grade","etape","motifSortie","dateCandidature","docs","dossier","recrutement","fi","affectation","fisp","qualifs"],
};
const estAdmin = r => r === "responsable" || r === "commandement";   // accès complet
const peutModifierCle = (role, cle) => estAdmin(role) || (CLES_MODIFIABLES[role] || []).includes(cle);
const rolesCreables = r => estAdmin(r) ? ["recrue","formateur","recruteur","recruteur_formateur","responsable","commandement"] : ["recruteur","recruteur_formateur"].includes(r) ? ["recrue"] : [];
const estStaff = r => ["commandement","responsable","recruteur_formateur","recruteur","formateur"].includes(r);

/* ---------- Outils ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const auj = () => new Date().toISOString().slice(0,10);
const dateFr = d => d ? new Date(d.length === 10 ? d + "T12:00:00" : d).toLocaleDateString("fr-FR") : "—";
const num = v => (v === "" || v == null || isNaN(Number(v))) ? null : Number(v);
const clone = o => JSON.parse(JSON.stringify(o));
const nomComplet = u => `${u.prenom || ""} ${(u.nom || "").toUpperCase()}`.trim() || "Sans nom";
const normaliserId = s => String(s || "").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, ".").replace(/[^a-z0-9._-]/g, "");
const genererMdp = () => { const a = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789"; const t = new Uint32Array(10); crypto.getRandomValues(t); return Array.from(t, n => a[n % a.length]).join(""); };
const getPath = (o, p) => p.split(".").reduce((a, k) => a?.[k], o);
function setPath(o, p, v){ const k = p.split("."); let c = o; for (let i = 0; i < k.length - 1; i++){ if (typeof c[k[i]] !== "object" || c[k[i]] === null) c[k[i]] = {}; c = c[k[i]]; } c[k.at(-1)] = v; }

function ficheVierge(){
  return {
    discord:"", tel:"", matricule:"", grade:"Élève sapeur", cs:AFFECTATION_DEFAUT,
    etape:"fi", motifSortie:"", dateCandidature:auj(),
    docs:{}, dossier:{note:"", decision:"", date:""},
    recrutement:{date:"", sport:"", qcm:"", entretien:"", msp:"", jury:""},
    fi:{modules:{}, evalQcm:"", evalMsp:"", evalDate:"", rattrapage:""},
    affectation:{dateFin:"", parrain:"", debut:"", fin:"", bilan:""},
    fisp:{}, qualifs:[],
  };
}
function normaliser(u){
  const v = ficheVierge(), s = u || {};
  return {
    ...v, ...s,
    docs:{...(s.docs||{})}, dossier:{...v.dossier, ...(s.dossier||{})},
    recrutement:{...v.recrutement, ...(s.recrutement||{})},
    fi:{...v.fi, ...(s.fi||{}), modules:{...((s.fi||{}).modules||{})}},
    affectation:{...v.affectation, ...(s.affectation||{})},
    fisp:{...(s.fisp||{})}, qualifs:Array.isArray(s.qualifs) ? s.qualifs : [],
  };
}

/* ---------- Calculs ---------- */
function calcRecrutement(s){
  const r = s.recrutement, sp = num(r.sport), q = num(r.qcm), e = num(r.entretien), m = num(r.msp);
  if ([sp,q,e,m].some(x => x === null)) return { total:null, apte:null };
  const total = Math.round((sp + q/2 + e + m) * 10) / 10;
  return { total, apte: total >= 24 && sp > 0 && q > 0 && e > 0 && m > 0 };
}
function calcFI(s){
  const faits = MODULES.filter(([k]) => s.fi.modules[k]?.fait).length;
  const q = num(s.fi.evalQcm), m = num(s.fi.evalMsp);
  if (q === null || m === null) return { faits, moyenne:null, reussi:null };
  const moyenne = Math.round(((q + m) / 2) * 10) / 10;
  return { faits, moyenne, reussi: moyenne >= 12 && q >= 8 && m >= 8 };
}
function progression(s){
  const pts = [
    num(s.dossier.note) !== null && num(s.dossier.note) >= 12,
    calcRecrutement(s).apte === true,
    ...MODULES.map(([k]) => !!s.fi.modules[k]?.fait),
    calcFI(s).reussi === true,
    !!s.affectation.fin,
    ...FISP.map(([k]) => !!s.fisp[k]?.date),
  ];
  return Math.round(pts.filter(Boolean).length / pts.length * 100);
}
function prochaineAction(s){
  switch (s.etape){
    case "candidature": return DOCS_OBLIG.every(k => s.docs[k]) ? "Noter le dossier" : "Dossier incomplet";
    case "convoque": return s.recrutement.date ? `Recrutement le ${dateFr(s.recrutement.date)}` : "Fixer la date de recrutement";
    case "fi": { const m = MODULES.find(([k]) => !s.fi.modules[k]?.fait); return m ? m[1].split(" — ")[0] + " à faire" : "Évaluation finale"; }
    case "parrainage": return s.affectation.fin ? `Bilan le ${dateFr(s.affectation.fin)}` : "Désigner un parrain";
    case "affecte": { const f = FISP.find(([k]) => !s.fisp[k]?.date); return f ? `FISP : ${f[1]}` : "Parcours à jour"; }
    case "sortie": return s.motifSortie || "Sorti du parcours";
  }
  return "";
}

/* ---------------- Back-end MODE DÉMO ---------------- */
function backendDemo(){
  const CLE = "bspp_gprp_v2_comptes", CLE_J = "bspp_gprp_v2_journaux", SESSION = "bspp_gprp_v2_session";
  const lire = (k, def) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? def; } catch { return def; } };
  const ecrire = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  let comptes = lire(CLE, null), journaux = lire(CLE_J, {});
  if (!Array.isArray(comptes)){
    comptes = [{ id:"demo-responsable", identifiant:"responsable", pwd:"bspp2026", prenom:"Paul", nom:"Morenti", role:"responsable",
      grade:"Caporal", cs:"CS Ménilmontant", matricule:"", actif:true, createdAt:new Date().toISOString(), createdBy:"système" }];
    ecrire(CLE, comptes);
  }
  const sauver = () => ecrire(CLE, comptes);
  const sansMdp = ({ pwd, ...p }) => p;
  let sessionMem = null;
  const lireS = () => { try { return sessionStorage.getItem(SESSION); } catch { return sessionMem; } };
  const ecrireS = v => { sessionMem = v; try { v ? sessionStorage.setItem(SESSION, v) : sessionStorage.removeItem(SESSION); } catch {} };
  return {
    mode:"demo",
    async courant(){ const u = comptes.find(x => x.id === lireS() && x.actif); return u ? sansMdp(u) : null; },
    async connexion(ident, pwd){
      const u = comptes.find(x => x.identifiant === normaliserId(ident));
      if (!u || u.pwd !== pwd) throw new Error("Identifiant ou mot de passe incorrect.");
      if (!u.actif) throw new Error("Ce compte est désactivé. Contacte le responsable recrutement.");
      ecrireS(u.id); return sansMdp(u);
    },
    async deconnexion(){ ecrireS(null); },
    async listerComptes(){ return comptes.map(sansMdp); },
    async lireCompte(id){ const u = comptes.find(x => x.id === id); return u ? sansMdp(u) : null; },
    async creerCompte(data, pwd){
      if (comptes.some(x => x.identifiant === data.identifiant)) throw new Error("Cet identifiant existe déjà.");
      const n = { id:"u" + Date.now().toString(36), ...data, pwd };
      comptes.push(n); sauver(); return sansMdp(n);
    },
    async modifierCompte(id, patch){
      const i = comptes.findIndex(x => x.id === id); if (i < 0) throw new Error("Compte introuvable.");
      const { mdp, ...reste } = patch; comptes[i] = { ...comptes[i], ...reste, ...(mdp ? { pwd:mdp } : {}) }; sauver();
    },
    async lireJournal(id){ return journaux[id] || []; },
    async ecrireJournal(id, entrees){ journaux[id] = entrees; ecrire(CLE_J, journaux); },
  };
}

/* ---------------- Back-end FIREBASE ---------------- */
const versEmail = id => `${normaliserId(id)}@${DOMAINE_IDENTIFIANT}`;
async function backendFirebase(cfg){
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  const { initializeApp } = await import(base + "firebase-app.js");
  const A = await import(base + "firebase-auth.js");
  const F = await import(base + "firebase-firestore.js");
  const app = initializeApp(cfg), auth = A.getAuth(app), db = F.getFirestore(app);
  const authSecondaire = A.getAuth(initializeApp(cfg, "creation-comptes")); // crée un compte sans déconnecter l'utilisateur
  const traduire = e => {
    const c = e?.code || "";
    if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return new Error("Identifiant ou mot de passe incorrect.");
    if (c.includes("email-already-in-use")) return new Error("Cet identifiant existe déjà.");
    if (c.includes("weak-password")) return new Error("Mot de passe trop court (6 caractères minimum).");
    if (c.includes("too-many-requests")) return new Error("Trop d'essais. Réessaie dans quelques minutes.");
    if (c.includes("permission-denied")) return new Error("Action refusée : ton rôle ne le permet pas.");
    if (c.includes("operation-not-allowed")) return new Error("La connexion par e-mail/mot de passe n'est pas activée dans Firebase.");
    return new Error(e?.message || "Erreur inconnue.");
  };
  const essayer = async f => { try { return await f(); } catch (e) { throw traduire(e); } };
  const profil = async uid => { const s = await F.getDoc(F.doc(db, "users", uid)); return s.exists() ? { id:uid, ...s.data() } : null; };
  return {
    mode:"firebase",
    peutChangerMdpAutrui: false,
    estVide: () => essayer(async () => !(await F.getDoc(F.doc(db, "config", "installation"))).exists()),
    installer: (data, pwd) => essayer(async () => {
      const cred = await A.createUserWithEmailAndPassword(auth, versEmail(data.identifiant), pwd);
      const u = { ...data, role:"responsable", actif:true, createdAt:new Date().toISOString(), createdBy:"installation" };
      const lot = F.writeBatch(db);
      lot.set(F.doc(db, "users", cred.user.uid), u);
      lot.set(F.doc(db, "config", "installation"), { par:cred.user.uid, le:new Date().toISOString() });
      await lot.commit();
      return { id:cred.user.uid, ...u };
    }),
    async courant(){
      await auth.authStateReady();
      const u = auth.currentUser; if (!u) return null;
      const p = await profil(u.uid);
      if (!p || !p.actif){ await A.signOut(auth); return null; }
      return p;
    },
    async connexion(ident, pwd){
      const cred = await essayer(() => A.signInWithEmailAndPassword(auth, versEmail(ident), pwd));
      const p = await profil(cred.user.uid);
      if (!p){ await A.signOut(auth); throw new Error("Compte sans fiche. Contacte le responsable recrutement."); }
      if (!p.actif){ await A.signOut(auth); throw new Error("Ce compte est désactivé. Contacte le responsable recrutement."); }
      return p;
    },
    async deconnexion(){ await A.signOut(auth); },
    listerComptes: () => essayer(async () => (await F.getDocs(F.collection(db, "users"))).docs.map(d => ({ id:d.id, ...d.data() }))),
    creerCompte: (data, pwd) => essayer(async () => {
      const cred = await A.createUserWithEmailAndPassword(authSecondaire, versEmail(data.identifiant), pwd);
      await A.signOut(authSecondaire);
      await F.setDoc(F.doc(db, "users", cred.user.uid), data);
      return { id:cred.user.uid, ...data };
    }),
    modifierCompte: (id, patch) => essayer(async () => {
      const { mdp, ...reste } = patch;
      if (mdp){
        if (id !== auth.currentUser?.uid) throw new Error("Avec Firebase, seul le titulaire peut changer son mot de passe (README).");
        await A.updatePassword(auth.currentUser, mdp);
      }
      if (Object.keys(reste).length) await F.updateDoc(F.doc(db, "users", id), reste);
    }),
    lireJournal: id => essayer(async () => { const s = await F.getDoc(F.doc(db, "journaux", id)); return s.exists() ? (s.data().entrees || []) : []; }),
    ecrireJournal: (id, entrees) => essayer(() => F.setDoc(F.doc(db, "journaux", id), { entrees })),
  };
}

/* ---------- Structure ---------- */
function entete(){
  const ong = estStaff(moi.role) ? `<nav class="onglets">
      <button data-onglet="suivi" class="${onglet === "suivi" ? "on" : ""}">Suivi des recrues</button>
      ${rolesCreables(moi.role).length || estAdmin(moi.role) ? `<button data-onglet="comptes" class="${onglet === "comptes" ? "on" : ""}">Comptes</button>` : ""}
    </nav>` : "";
  return `
  ${B.mode === "demo" ? `<div class="demo">Mode démo : les données sont enregistrées uniquement dans ce navigateur. Branche Firebase pour la vraie version (voir README).</div>` : ""}
  <header class="top">
    <div class="titre">BSPP · GPRP<small>Suivi recrutement & formation</small></div>
    ${ong}

    <div class="moi">${esc((moi.grade ? moi.grade + " " : "") + nomComplet(moi))}<br><span style="opacity:.7">${esc(ROLES[moi.role] || moi.role)}</span></div>
    <button class="btn petit" id="b-deco">Déconnexion</button>
  </header>`;
}
function brancherEntete(){
  document.getElementById("b-deco").onclick = async () => { await B.deconnexion(); moi = null; fiche = null; onglet = "suivi"; filtre = { etape:"", q:"", role:"" }; vueConnexion(); };
  document.querySelectorAll("[data-onglet]").forEach(b => b.onclick = () => {
    if (fiche?.modifie && !confirmerQuitter(b)) return;
    onglet = b.dataset.onglet; fiche = null; afficher();
  });
}
function confirmerQuitter(btn){
  if (btn.dataset.ok) return true;
  btn.dataset.ok = "1"; btn.textContent = "Quitter sans enregistrer ?"; return false;
}

async function accueil(){
  if (moi.role === "recrue"){ vueRecrue(); return; }
  $app.innerHTML = entete() + `<main><div class="vide">Chargement…</div></main>`;
  brancherEntete();
  await recharger();
}
async function recharger(){
  try { comptes = (await B.listerComptes()).map(normaliser); afficher(); }
  catch (e) { document.querySelector("main").innerHTML = `<div class="erreur">${esc(e.message)}</div>`; }
}
function afficher(){
  if (fiche) return vueFiche();
  onglet === "comptes" ? vueComptes() : vueSuivi();
}

function remplirSuivi(){
  const q = filtre.q.trim().toLowerCase(), ordre = Object.fromEntries(ETAPES.map(([k], i) => [k, i]));
  const liste = comptes.filter(c => c.role === "recrue" && c.actif)
    .filter(s => !filtre.etape || s.etape === filtre.etape)
    .filter(s => !q || `${s.prenom} ${s.nom} ${s.matricule} ${s.cs} ${s.identifiant}`.toLowerCase().includes(q))
    .sort((a, b) => (ordre[a.etape] - ordre[b.etape]) || nomComplet(a).localeCompare(nomComplet(b), "fr"));
  const corps = document.getElementById("corps");
  if (!liste.length){ corps.innerHTML = `<tr><td colspan="5" class="vide">Aucune recrue ici.</td></tr>`; return; }
  corps.innerHTML = liste.map(s => { const p = progression(s); return `

          <button class="btn sec" id="b-note">Ajouter</button>
        </div>
        <div style="margin-top:8px">
          ${fiche.journal.length ? fiche.journal.map((n, i) => ({ ...n, i })).sort((a, b) => (b.date || "").localeCompare(a.date || "")).map(n => `
            <div class="ligne-item"><div class="d">${dateFr(n.date)}</div><div style="flex:1">${esc(n.texte)}${n.auteur ? `<div class="sous">${esc(n.auteur)}</div>` : ""}</div>
            ${estAdmin(moi.role) ? `<button class="lien" data-suppr-note="${n.i}" aria-label="Retirer">✕</button>` : ""}</div>`).join("") : `<div class="sous">Aucune note.</div>`}
        </div>
      </div>
    </div>

    ${peutQuelqueChose ? `<div class="barre-sauver">
      <button class="btn" id="b-sauver" ${fiche.enreg ? "disabled" : ""}>Enregistrer</button>
      <span class="etat" id="etat"></span>
    </div>` : ""}
  </main>`;
  brancherEntete();
  majEtat();
  brancherFiche();
}

function majEtat(){
  const el = document.getElementById("etat"); if (!el) return;
  if (fiche.modifie){ el.textContent = "Modifications non enregistrées"; el.className = "etat modif"; }
  else { el.textContent = fiche.msg; el.className = "etat" + (fiche.msg.startsWith("Échec") || fiche.msg.startsWith("Action") ? " err" : ""); }
}
function marquer(){ fiche.modifie = true; fiche.msg = ""; majEtat(); }
function majCalculs(){
  const s = fiche.brouillon, rec = calcRecrutement(s), fi = calcFI(s), p = progression(s);
  const set = (k, txt, cls) => { const el = $app.querySelector(`[data-calc="${k}"]`); if (el){ el.textContent = txt; el.className = "resultat " + cls; } };
  set("dossier", resumeDossier(s), clsDossier(s));
  set("recrutement", resumeRecrutement(s), clsBool(rec.apte));
  set("fi", resumeFI(s), clsBool(fi.reussi));
  const pr = document.getElementById("prog-fiche"); if (pr) pr.innerHTML = `<div class="b"><i style="width:${p}%"></i></div><span>${p} %</span>`;
}

function brancherFiche(){
  document.getElementById("b-retour").onclick = e => {
    if (fiche.modifie && !confirmerQuitter(e.currentTarget)) return;
    fiche = null; afficher();
  };
  $app.querySelectorAll("[data-f]").forEach(el => el.addEventListener(el.tagName === "SELECT" ? "change" : "input", () => {
    setPath(fiche.brouillon, el.dataset.f, el.value); marquer();
    el.dataset.f === "etape" ? vueFiche() : majCalculs();
  }));
  $app.querySelectorAll("[data-c]").forEach(el => el.addEventListener("change", () => {
    setPath(fiche.brouillon, el.dataset.c, el.checked);
    if (el.checked && el.dataset.c.startsWith("fi.modules.")){
      const b = el.dataset.c.replace(/\.fait$/, "");
      if (!getPath(fiche.brouillon, b + ".date")) setPath(fiche.brouillon, b + ".date", auj());
      if (!getPath(fiche.brouillon, b + ".formateur") && !["recruteur"].includes(moi.role)) setPath(fiche.brouillon, b + ".formateur", nomComplet(moi));
    }
    marquer(); vueFiche();
  }));
  const bq = document.getElementById("b-qualif");
  if (bq) bq.onclick = () => {
    const nom = document.getElementById("qualif-nom").value.trim(); if (!nom) return;
    fiche.brouillon.qualifs.push({ nom, date: document.getElementById("qualif-date").value }); marquer(); vueFiche();
  };
  $app.querySelectorAll("[data-suppr-qualif]").forEach(b => b.onclick = () => { fiche.brouillon.qualifs.splice(Number(b.dataset.supprQualif), 1); marquer(); vueFiche(); });

  const ajouterNote = async () => {
    const texte = document.getElementById("note-texte").value.trim(); if (!texte) return;
    const entrees = [...fiche.journal, { date: document.getElementById("note-date").value || auj(), texte, auteur: nomComplet(moi) }];
    try { await B.ecrireJournal(fiche.id, entrees); fiche.journal = entrees; vueFiche(); }
    catch (e) { fiche.msg = "Échec de l'ajout de la note : " + e.message; majEtat(); }
  };
  document.getElementById("b-note").onclick = ajouterNote;
  document.getElementById("note-texte").onkeydown = e => { if (e.key === "Enter") ajouterNote(); };
  $app.querySelectorAll("[data-suppr-note]").forEach(b => b.onclick = async () => {
    const entrees = fiche.journal.filter((_, i) => i !== Number(b.dataset.supprNote));
    try { await B.ecrireJournal(fiche.id, entrees); fiche.journal = entrees; vueFiche(); } catch (e) { fiche.msg = "Échec : " + e.message; majEtat(); }
  });
  const bs = document.getElementById("b-sauver"); if (bs) bs.onclick = enregistrerFiche;
}

async function enregistrerFiche(){
  if (fiche.enreg) return;
  // N'envoie que les champs modifiés et autorisés pour ce rôle.
  const patch = {};
  for (const k of Object.keys(fiche.brouillon)){
    if (["id","identifiant","role","actif","createdAt","createdBy"].includes(k)) continue;
    if (JSON.stringify(fiche.brouillon[k]) !== JSON.stringify(fiche.origine[k]) && peutModifierCle(moi.role, k)) patch[k] = clone(fiche.brouillon[k]);
  }
  if (!Object.keys(patch).length){ fiche.modifie = false; fiche.msg = "Rien à enregistrer"; majEtat(); return; }
  patch.updatedAt = new Date().toISOString();
  patch.updatedBy = nomComplet(moi);
  fiche.enreg = true; fiche.msg = "Enregistrement…"; fiche.modifie = false; majEtat();
  try {
    await B.modifierCompte(fiche.id, patch);
    Object.assign(fiche.brouillon, clone(patch));
    fiche.origine = clone(fiche.brouillon);
    const i = comptes.findIndex(c => c.id === fiche.id); if (i >= 0) comptes[i] = clone(fiche.brouillon);
    fiche.msg = "Enregistré ✓";
  } catch (e) { fiche.modifie = true; fiche.msg = "Échec de l'enregistrement : " + e.message; }
  fiche.enreg = false; vueFiche();
}

/* ---------- Onglet COMPTES ---------- */
function vueComptes(){
  const n = r => comptes.filter(c => c.role === r && c.actif).length;
  $app.innerHTML = entete() + `
  <main>
    <div class="barre"><h2>Comptes</h2><div class="esp"></div>
      ${rolesCreables(moi.role).length ? `<button class="btn" id="b-creer">+ Créer un compte</button>` : ""}</div>
    <div class="stats">
      <div class="stat"><div class="n">${comptes.filter(c => c.actif).length}</div><div class="l">Comptes actifs</div></div>
      <div class="stat"><div class="n">${n("recrue")}</div><div class="l">Recrues / sapeurs</div></div>
      <div class="stat"><div class="n">${n("formateur") + n("recruteur") + n("recruteur_formateur")}</div><div class="l">Formateurs & recruteurs</div></div>
      <div class="stat"><div class="n">${n("responsable") + n("commandement")}</div><div class="l">Responsables & commandement</div></div>
    </div>
    <div class="carte">
      <div class="barre">
        <input id="q" placeholder="Rechercher un nom, un identifiant…" value="${esc(filtre.q)}">
        <select id="fr"><option value="">Tous les rôles</option>${Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${filtre.role === k ? "selected" : ""}>${v}</option>`).join("")}</select>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Nom</th><th>Identifiant</th><th>Rôle</th><th>Grade</th><th>Affectation</th><th>Statut</th>${estAdmin(moi.role) ? "<th></th>" : ""}</tr></thead>
        <tbody id="corps"></tbody>
      </table></div>
    </div>
  </main>`;
  brancherEntete();
  remplirComptes();
  document.getElementById("q").oninput = e => { filtre.q = e.target.value; remplirComptes(); };
  document.getElementById("fr").onchange = e => { filtre.role = e.target.value; remplirComptes(); };
  const bc = document.getElementById("b-creer"); if (bc) bc.onclick = () => fenetreCompte();
}
function remplirComptes(){
  const q = filtre.q.trim().toLowerCase();
  const liste = comptes.filter(c => !filtre.role || c.role === filtre.role)
    .filter(c => !q || `${c.prenom} ${c.nom} ${c.identifiant} ${c.matricule} ${c.cs}`.toLowerCase().includes(q))
    .sort((a, b) => (b.actif - a.actif) || nomComplet(a).localeCompare(nomComplet(b), "fr"));
  const corps = document.getElementById("corps"), resp = estAdmin(moi.role);
  if (!liste.length){ corps.innerHTML = `<tr><td colspan="7" class="vide">Aucun compte.</td></tr>`; return; }
  corps.innerHTML = liste.map(c => `
    <tr class="${c.actif ? "" : "inactif"}">
      <td><b>${esc(nomComplet(c))}</b>${c.matricule ? `<div class="sous">Mle ${esc(c.matricule)}</div>` : ""}</td>
      <td>${esc(c.identifiant)}</td>
      <td><span class="badge r-${esc(c.role)}">${esc(ROLES[c.role] || c.role)}</span></td>
      <td>${esc(c.grade || "—")}</td><td>${esc(c.cs || "—")}</td>
      <td>${c.actif ? `<span class="s-actif">Actif</span>` : `<span class="s-inactif">Désactivé</span>`}</td>
      ${resp ? `<td><button class="btn sec petit" data-modif="${esc(c.id)}">Modifier</button></td>` : ""}
    </tr>`).join("");
  corps.querySelectorAll("[data-modif]").forEach(b => b.onclick = () => fenetreCompte(comptes.find(c => c.id === b.dataset.modif)));
}

/* ---------- Fenêtre création / modification de compte ---------- */
function fenetreCompte(existant = null, roleImpose = null){
  const edition = !!existant;
  const roles = edition ? Object.keys(ROLES) : (roleImpose ? [roleImpose] : rolesCreables(moi.role));
  const v = existant || { prenom:"", nom:"", role:roles[0], grade:"Élève sapeur", matricule:"", cs:AFFECTATION_DEFAUT };
  const soiMeme = edition && existant.id === moi.id;
  const voile = document.createElement("div");
  voile.className = "voile";
  voile.innerHTML = `
  <form class="fenetre">
    <h3>${edition ? "Modifier le compte" : roleImpose === "recrue" ? "Nouvelle recrue" : "Créer un compte"}</h3>
    <div class="sous" style="font-size:14px">${edition ? esc(nomComplet(existant)) : "Tu remettras les identifiants à la personne en fin d'entretien."}</div>
    <div class="g2">
      <div><label class="l">Prénom</label><input name="prenom" required value="${esc(v.prenom)}"></div>
      <div><label class="l">Nom</label><input name="nom" required value="${esc(v.nom)}"></div>
      ${edition ? "" : `
      <div><label class="l">Identifiant de connexion</label><input name="identifiant" required placeholder="prenom.nom"></div>
      <div><label class="l">Mot de passe provisoire</label><div class="ligne-mdp"><input name="mdp" required minlength="6" value="${genererMdp()}"><button type="button" class="btn sec petit" id="b-gen" aria-label="Nouveau mot de passe">↻</button></div></div>`}
      <div><label class="l">Rôle</label><select name="role" ${soiMeme || roles.length === 1 ? "disabled" : ""}>${roles.map(r => `<option value="${r}" ${v.role === r ? "selected" : ""}>${ROLES[r]}</option>`).join("")}</select></div>
      <div><label class="l">Grade</label><select name="grade">${GRADES.map(g => `<option ${v.grade === g ? "selected" : ""}>${g}</option>`).join("")}</select></div>
      <div><label class="l">Matricule (facultatif)</label><input name="matricule" value="${esc(v.matricule)}"></div>
      <div><label class="l">Affectation (CS)</label><input name="cs" placeholder="ex. CS Ménilmontant" value="${esc(v.cs)}"></div>
      ${edition && (B.peutChangerMdpAutrui !== false || soiMeme) ? `<div style="grid-column:1/-1"><label class="l">Nouveau mot de passe (laisser vide pour ne pas changer)</label><input name="nouveauMdp" minlength="6" autocomplete="new-password"></div>` : ""}
      ${edition && !soiMeme ? `<div style="grid-column:1/-1"><label class="l">Statut</label><select name="actif"><option value="1" ${existant.actif ? "selected" : ""}>Actif</option><option value="0" ${existant.actif ? "" : "selected"}>Désactivé (ne peut plus se connecter)</option></select></div>` : ""}
    </div>
    <div id="msg"></div>
    <div class="actions"><button type="button" class="btn sec" id="b-annuler">Annuler</button><button type="submit" class="btn">${edition ? "Enregistrer" : "Créer le compte"}</button></div>
  </form>`;
  document.body.appendChild(voile);
  const f = voile.querySelector("form"), fermer = () => voile.remove();
  voile.querySelector("#b-annuler").onclick = fermer;
  voile.onclick = e => { if (e.target === voile) fermer(); };
  if (!edition){
    const auto = () => { if (!f.identifiant.dataset.touche) f.identifiant.value = normaliserId(`${f.prenom.value}.${f.nom.value}`.replace(/^\.|\.$/g, "")); };
    f.prenom.oninput = auto; f.nom.oninput = auto;
    f.identifiant.oninput = () => { f.identifiant.dataset.touche = "1"; };
    voile.querySelector("#b-gen").onclick = () => { f.mdp.value = genererMdp(); };
  }
  f.onsubmit = async ev => {
    ev.preventDefault();
    const msg = voile.querySelector("#msg"); msg.innerHTML = "";
    const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
    const data = { prenom:f.prenom.value.trim(), nom:f.nom.value.trim(), role: soiMeme || roles.length === 1 ? (existant?.role || roles[0]) : f.role.value,
      grade:f.grade.value, matricule:f.matricule.value.trim(), cs:f.cs.value.trim() };
    try {
      if (edition){
        if (f.actif) data.actif = f.actif.value === "1";
        data.updatedAt = new Date().toISOString(); data.updatedBy = nomComplet(moi);
        const nouveauMdp = f.nouveauMdp ? f.nouveauMdp.value : "";
        if (nouveauMdp && nouveauMdp.length < 6) throw new Error("Mot de passe trop court (6 caractères minimum).");
        await B.modifierCompte(existant.id, nouveauMdp ? { ...data, mdp:nouveauMdp } : data);
        Object.assign(existant, data); if (soiMeme) Object.assign(moi, data);
        fermer(); afficher();
      } else {
        const ident = normaliserId(f.identifiant.value);
        if (!ident) throw new Error("Identifiant invalide.");
        if (f.mdp.value.length < 6) throw new Error("Mot de passe trop court (6 caractères minimum).");
        if (!rolesCreables(moi.role).includes(data.role)) throw new Error("Ton rôle ne permet pas de créer ce type de compte.");
        const complet = { ...(data.role === "recrue" ? ficheVierge() : {}), ...data, identifiant:ident, actif:true,
          createdAt:new Date().toISOString(), createdBy:nomComplet(moi) };
        const nouveau = normaliser(await B.creerCompte(complet, f.mdp.value));
        comptes.push(nouveau);
        const texte = `Identifiant : ${ident}\nMot de passe : ${f.mdp.value}\nSite : ${location.href.split("#")[0]}`;
        f.innerHTML = `
          <h3>Compte créé</h3>
          <div class="ok">${esc(nomComplet(nouveau))} · ${esc(ROLES[nouveau.role])}</div>
          <p style="margin:14px 0 0">Donne ces identifiants à la personne :</p>
          <div class="identifiants">${esc(texte)}</div>
          <div class="actions">
            <button type="button" class="btn sec" id="b-copier">Copier</button>
            ${nouveau.role === "recrue" ? `<button type="button" class="btn sec" id="b-ouvrir">Ouvrir sa fiche</button>` : ""}
            <button type="button" class="btn" id="b-fin">Terminé</button>
          </div>`;
        f.querySelector("#b-copier").onclick = async e => { try { await navigator.clipboard.writeText(texte); e.target.textContent = "Copié ✓"; } catch { e.target.textContent = "Sélectionne et copie"; } };
        f.querySelector("#b-fin").onclick = () => { fermer(); afficher(); };
        const bo = f.querySelector("#b-ouvrir"); if (bo) bo.onclick = () => { fermer(); onglet = "suivi"; ouvrirFiche(nouveau.id); };
      }
    } catch (e) { msg.innerHTML = `<div class="erreur">${esc(e.message)}</div>`; btn.disabled = false; }
  };
}

/* ---------- Vue RECRUE (lecture seule) ---------- */
function vueRecrue(){
  const s = normaliser(moi), fi = calcFI(s), p = progression(s);
  const pastille = (ok, txt, d) => `<li><span class="pastille ${ok ? "oui" : ""}">${ok ? "✓" : ""}</span><span style="flex:1">${esc(txt)}</span><span class="sous">${d ? dateFr(d) : ""}</span></li>`;
  $app.innerHTML = entete() + `
  <main>
    <div class="entete-fiche">
      <h2>Ma progression</h2>
      <span class="badge e-${esc(s.etape)}">${esc(NOM_ETAPE[s.etape] || s.etape)}</span>
      <div class="esp"></div>
      <div class="prog" style="min-width:200px"><div class="b"><i style="width:${p}%"></i></div><span>${p} %</span></div>
    </div>
    <div class="sections">
      <div class="carte fiche">
        <h3 style="margin:0">Mes informations</h3>
        <dl>
          <dt>Nom</dt><dd>${esc(nomComplet(s))}</dd>
          <dt>Grade</dt><dd>${esc(s.grade || "—")}</dd>
          <dt>Matricule</dt><dd>${esc(s.matricule || "—")}</dd>
          <dt>Affectation</dt><dd>${esc(s.cs || "—")}</dd>
          <dt>Parrain</dt><dd>${esc(s.affectation.parrain || "—")}</dd>
          <dt>Prochaine étape</dt><dd>${esc(prochaineAction(s))}</dd>
        </dl>
      </div>
      <div class="carte">
        <h3 style="margin:0">Formation initiale</h3>
        <ul class="liste-statut">
          ${MODULES.map(([k, l]) => pastille(s.fi.modules[k]?.fait, l, s.fi.modules[k]?.date)).join("")}
          ${pastille(fi.reussi === true, fi.moyenne === null ? "Évaluation finale" : `Évaluation finale : ${fi.moyenne}/20${fi.reussi ? " · réussie" : ""}`, s.fi.evalDate)}
        </ul>
      </div>
      <div class="carte">
        <h3 style="margin:0">FISP</h3>
        <ul class="liste-statut">${FISP.map(([k, l]) => pastille(!!s.fisp[k]?.date, l, s.fisp[k]?.date)).join("")}</ul>
      </div>
      <div class="carte">
        <h3 style="margin:0">Qualifications</h3>
        <ul class="liste-statut">${s.qualifs.length ? s.qualifs.map(q => pastille(true, q.nom, q.date)).join("") : `<li class="sous">Aucune pour l'instant.</li>`}</ul>
      </div>
    </div>
  </main>`;
  brancherEntete();
}

/* ---------- Démarrage ---------- */
(async () => {
  try {
    B = FIREBASE_CONFIG ? await backendFirebase(FIREBASE_CONFIG) : backendDemo();
    if (B.mode === "firebase" && await B.estVide()) return vueInstallation();
    moi = await B.courant();
    moi ? await accueil() : vueConnexion();
  } catch (e) {
    $app.innerHTML = `<main><div class="erreur">Impossible de démarrer : ${esc(e.message)}</div></main>`;
  }
})();
</script>
</body>
</html>
